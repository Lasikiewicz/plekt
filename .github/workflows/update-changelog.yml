# Keep legacy image targets for at least six months after the Plekt release.
name: Publish Main Release

# Builds and publishes the release image and the formatted GitHub Release notes
# on every push to main, tagged :latest and :<version> on GHCR and Docker Hub. changelog.json,
# CHANGELOG.md, package.json, and package-lock.json are all computed locally
# (scripts/promote-alpha-to-main.js), as part of "Force to main", before the
# force-push - this job checks README consistency, runs the full build gate against
# what was already committed, and never writes back to the branch. The Windows
# workflow attaches the installer and checksum to the same GitHub Release. The
# OCI-hosted public demo is refreshed by the deploy job below after the
# release image has been published. Portainer is local-only and is not a release gate.

on:
  push:
    branches:
      - main

concurrency:
  group: changelog-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lasikiewicz/plekt
  LEGACY_IMAGE_NAME: lasikiewicz/plembfin
  DOCKERHUB_IMAGE: docker.io/plembfin/plekt
  LEGACY_DOCKERHUB_IMAGE: docker.io/plembfin/plembfin

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check README consistency
        run: npm run docs:check

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3 sharp

      - name: Run build check
        run: npm run build

      - name: Read release version
        id: release
        run: node -e "const fs=require('fs'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./changelog.json').version + '\n')"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Main releases are mirrored to both Docker Hub names during the transition;
      # develop and alpha stay on GHCR only, where ghcr-cleanup.yml prunes them.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # provenance/sbom push a multi-manifest index, and GHCR reads the
      # package description from the index annotations, not image labels.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.LEGACY_DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.release.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true

      - name: Publish GitHub release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-github-release.js main

      - name: Notify Discord releases channel
        env:
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: node scripts/notify-discord-release.js main

  deploy-oracle-demo:
    name: Deploy public demo to OCI
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.update.outputs.version }}
      RELEASE_IMAGE: ghcr.io/lasikiewicz/plekt:${{ needs.update.outputs.version }}
      OCI_DEMO_HOST: ${{ vars.OCI_DEMO_HOST }}
      OCI_DEMO_USER: ${{ vars.OCI_DEMO_USER || 'opc' }}
      OCI_DEMO_KNOWN_HOSTS: ${{ vars.OCI_DEMO_KNOWN_HOSTS }}
      OCI_DEMO_CONTAINER: ${{ vars.OCI_DEMO_CONTAINER }}
      OCI_DEMO_DATA_DIR: ${{ vars.OCI_DEMO_DATA_DIR }}
      OCI_DEMO_PORT: ${{ vars.OCI_DEMO_PORT || '80' }}
      OCI_DEMO_RUNTIME: ${{ vars.OCI_DEMO_RUNTIME }}
      PLEMBFIN_TRAKS_SCRIPT_URL: ${{ vars.PLEKT_TRAKS_SCRIPT_URL || vars.PLEMBFIN_TRAKS_SCRIPT_URL }}
      PLEMBFIN_TRAKS_COLLECTOR_ORIGIN: ${{ vars.PLEKT_TRAKS_COLLECTOR_ORIGIN || vars.PLEMBFIN_TRAKS_COLLECTOR_ORIGIN }}
      PLEMBFIN_TRAKS_SITE_KEY: ${{ vars.PLEKT_TRAKS_SITE_KEY || vars.PLEMBFIN_TRAKS_SITE_KEY }}
      PLEMBFIN_TRAKS_REQUIRE_CONSENT: ${{ vars.PLEKT_TRAKS_REQUIRE_CONSENT || vars.PLEMBFIN_TRAKS_REQUIRE_CONSENT || 'true' }}
    steps:
      - name: Checkout deployment helper
        uses: actions/checkout@v7

      - name: Check OCI deployment configuration
        env:
          OCI_DEMO_SSH_KEY: ${{ secrets.OCI_DEMO_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in OCI_DEMO_HOST OCI_DEMO_KNOWN_HOSTS OCI_DEMO_CONTAINER OCI_DEMO_DATA_DIR OCI_DEMO_RUNTIME OCI_DEMO_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions setting: $name" >&2
              exit 1
            fi
          done
          case "$OCI_DEMO_HOST" in
            *[!A-Za-z0-9.-]* ) echo "OCI_DEMO_HOST must be a hostname or IPv4 address" >&2; exit 1 ;;
          esac
          case "$OCI_DEMO_USER" in
            *[!A-Za-z0-9_.-]* ) echo "OCI_DEMO_USER contains unsupported characters" >&2; exit 1 ;;
          esac

      - name: Configure pinned OCI SSH access
        env:
          OCI_DEMO_SSH_KEY: ${{ secrets.OCI_DEMO_SSH_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/plembfin-oci-demo-key"
          known_hosts_path="$RUNNER_TEMP/plembfin-oci-demo-known-hosts"
          printf '%s\n' "$OCI_DEMO_SSH_KEY" > "$key_path"
          printf '%s\n' "$OCI_DEMO_KNOWN_HOSTS" > "$known_hosts_path"
          chmod 600 "$key_path" "$known_hosts_path"
          echo "SSH_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "KNOWN_HOSTS_PATH=$known_hosts_path" >> "$GITHUB_ENV"

      - name: Deploy the exact release image to OCI
        run: |
          set -euo pipefail
          remote_script="/tmp/plembfin-oracle-demo-${GITHUB_RUN_ID}.sh"
          ssh_opts=(-i "$SSH_KEY_PATH" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_PATH")
          scp "${ssh_opts[@]}" scripts/deploy-oracle-demo.sh "$OCI_DEMO_USER@$OCI_DEMO_HOST:$remote_script"
          trap 'ssh "${ssh_opts[@]}" "$OCI_DEMO_USER@$OCI_DEMO_HOST" "rm -f -- $remote_script" >/dev/null 2>&1 || true' EXIT
          printf -v remote_command 'chmod 700 %q && sudo -n bash %q %q %q %q %q %q %q %q %q %q %q' \
            "$remote_script" "$remote_script" "$RELEASE_IMAGE" "$OCI_DEMO_CONTAINER" \
            "$OCI_DEMO_DATA_DIR" "$OCI_DEMO_PORT" "$OCI_DEMO_RUNTIME" \
            "$PLEMBFIN_TRAKS_SCRIPT_URL" "$PLEMBFIN_TRAKS_SITE_KEY" "$PLEMBFIN_TRAKS_REQUIRE_CONSENT" \
            "$PLEMBFIN_TRAKS_COLLECTOR_ORIGIN"
          ssh "${ssh_opts[@]}" "$OCI_DEMO_USER@$OCI_DEMO_HOST" "$remote_command"

      - name: Verify the released demo
        run: node scripts/verify-oracle-demo.js "$RELEASE_VERSION"
