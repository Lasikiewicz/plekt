# Keep legacy image targets for at least six months after the Plekt release.
name: Publish Alpha Image

# Publishes a rolling pre-release image and the formatted GitHub Release notes
# on every push to alpha, tagged :alpha and :alpha-<build>.
# changelog.alpha.json's build counter and changelog entry are computed locally
# (scripts/promote-develop-to-alpha.js), as part of "Force to alpha", before
# the force-push - this job just reads the value already committed, and never
# writes back to the branch. This never touches changelog.json or the real
# package version; those only change when alpha is promoted to main via
# "Force to main". The image is verified the same way docker-build-check.yml
# verifies main's release image before it is pushed. The Windows workflow
# attaches the installer and checksum to the same GitHub prerelease.

on:
  push:
    branches: [alpha]

concurrency:
  group: docker-publish-alpha
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lasikiewicz/plekt
  LEGACY_IMAGE_NAME: lasikiewicz/plembfin

jobs:
  publish:
    name: Verify and publish the alpha image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check README consistency
        run: npm run docs:check

      - name: Read alpha build number
        id: alpha
        run: node -e "const fs=require('fs'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build=' + require('./changelog.alpha.json').build + '\n')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: plekt:alpha-check
          build-args: BUILD_CHANNEL=alpha
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same probe as docker-build-check.yml: production dependencies install
      # with --ignore-scripts, so a native module with no usable binary for
      # this platform still builds cleanly and would only fail on first
      # database open.
      - name: Verify native modules load inside the image
        run: |
          docker run --rm --entrypoint node plekt:alpha-check -e "
            const Database = require('better-sqlite3');
            const sharp = require('sharp');
            const db = new Database(':memory:');
            db.exec('CREATE TABLE probe (value TEXT)');
            db.prepare('INSERT INTO probe VALUES (?)').run('ok');
            const row = db.prepare('SELECT value FROM probe').get();
            db.close();
            if (row.value !== 'ok') throw new Error('better-sqlite3 returned unexpected data');
            sharp({ create: { width: 8, height: 8, channels: 3, background: '#000000' } })
              .webp()
              .toBuffer()
              .then((buffer) => {
                if (!buffer.length) throw new Error('sharp produced an empty image');
                console.log('better-sqlite3', require('better-sqlite3/package.json').version, 'and sharp', sharp.versions.sharp, 'both load in the image');
              })
              .catch((error) => { console.error(error); process.exit(1); });
          "

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action lowercases the image ref; github.repository
      # preserves the owner's account casing (Lasikiewicz/plembfin), which
      # GHCR rejects as an image tag. provenance/sbom push a multi-manifest
      # index, and GHCR reads the package description from the index
      # annotations, not image labels.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
          tags: |
            type=raw,value=alpha
            type=raw,value=alpha-${{ steps.alpha.outputs.build }}

      - name: Build and push alpha image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: BUILD_CHANNEL=alpha
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Publish GitHub prerelease notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-github-release.js alpha

      - name: Notify Discord releases channel
        env:
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: node scripts/notify-discord-release.js alpha
