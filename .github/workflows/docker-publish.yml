# Keep legacy image targets for at least six months after the Plekt release.
name: Build and Push Docker Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lasikiewicz/plekt
  LEGACY_IMAGE_NAME: lasikiewicz/plembfin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3 sharp

      - name: Run build check
        run: npm run build

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read application version
        id: version
        run: node -e "const fs=require('fs'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./changelog.json').version + '\n')"

      # provenance/sbom push a multi-manifest index, and GHCR reads the
      # package description from the index annotations, not image labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/plembfin/plekt
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true

      # The retiring Plembfin names (GHCR and Docker Hub) get the same image plus
      # PLEKT_LEGACY_IMAGE=1 (packaging/legacy-image/Dockerfile).
      - name: Extract legacy Docker metadata
        id: legacy_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
            docker.io/plembfin/plembfin
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push legacy Docker image
        uses: docker/build-push-action@v7
        with:
          context: packaging/legacy-image
          push: true
          tags: ${{ steps.legacy_meta.outputs.tags }}
          build-args: BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      # The public demo's artwork layer on the Plekt image, GHCR only
      # (packaging/demo-image/Dockerfile). Runs last so it cannot stop the Plekt image.
      - name: Build and push demo layer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/demo-image/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-demo
          build-args: BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
