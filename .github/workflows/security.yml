name: Security

on:
  push:
    branches: [main, alpha]
  pull_request:
    branches: [main, alpha]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: npm ci --ignore-scripts (with retry)
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts && exit 0
            echo "npm ci failed (attempt $attempt/3), retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - run: npm audit --audit-level=high

      - name: npm ci --ignore-scripts (website)
        working-directory: website
        run: npm ci --ignore-scripts
      - name: npm audit --audit-level=high (website)
        working-directory: website
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    # Mark this check as required in the main/alpha branch rulesets. Push
    # events keep the default branches continuously monitored; pull requests
    # are the blocking path before a change is merged or promoted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.38.3
        with:
          languages: javascript
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4.38.3
        with:
          # Keep a local copy so the following gate can inspect the exact
          # post-processed results that CodeQL uploads to code scanning.
          output: ${{ runner.temp }}/codeql-results
          post-processed-sarif-path: ${{ runner.temp }}/codeql-processed
          wait-for-processing: true

      - name: Block high-severity CodeQL findings
        env:
          CODEQL_RESULTS: ${{ runner.temp }}/codeql-processed
        run: node .github/scripts/check-codeql-severity.mjs "$CODEQL_RESULTS"
