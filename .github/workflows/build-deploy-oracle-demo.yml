name: Build and Deploy Public Demo

# Manual demo-only path. This builds a uniquely tagged multi-architecture
# image from the selected source ref and deploys it to Oracle. It does not
# promote branches, update release metadata, publish release notes, or replace
# the official latest/version image tags.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or ref containing the demo code; blank uses main"
        required: false
        default: main
        type: string
      confirm:
        description: "Type BUILD-DEMO to confirm the demo-only image build and deployment"
        required: true
        type: string

concurrency:
  group: build-deploy-oracle-demo
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build multi-architecture demo image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout selected demo source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || 'main' }}

      - name: Validate demo request and derive image tag
        id: release
        env:
          DEMO_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$DEMO_CONFIRMATION" != "BUILD-DEMO" ]; then
            echo 'The confirmation input must be exactly BUILD-DEMO.' >&2
            exit 1
          fi
          release_version="$(node -p "require('./changelog.json').version")"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The selected demo source does not contain a numbered release version: $release_version" >&2
            exit 1
          fi
          source_sha="$(git rev-parse --short=12 HEAD)"
          image="ghcr.io/lasikiewicz/plekt:demo-main-$source_sha"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Building demo-only image $image from $source_sha"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push demo image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.image }}
          build-args: BUILD_CHANNEL=main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Confirm both demo image architectures
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$RELEASE_IMAGE"

  deploy:
    name: Deploy demo image to OCI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_IMAGE: ${{ needs.build.outputs.image }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      OCI_DEMO_HOST: ${{ vars.OCI_DEMO_HOST }}
      OCI_DEMO_USER: ${{ vars.OCI_DEMO_USER || 'opc' }}
      OCI_DEMO_KNOWN_HOSTS: ${{ vars.OCI_DEMO_KNOWN_HOSTS }}
      OCI_DEMO_CONTAINER: ${{ vars.OCI_DEMO_CONTAINER }}
      OCI_DEMO_DATA_DIR: ${{ vars.OCI_DEMO_DATA_DIR }}
      OCI_DEMO_PORT: ${{ vars.OCI_DEMO_PORT || '80' }}
      OCI_DEMO_RUNTIME: ${{ vars.OCI_DEMO_RUNTIME }}
      PLEMBFIN_TRAKS_SCRIPT_URL: ${{ vars.PLEKT_TRAKS_SCRIPT_URL || vars.PLEMBFIN_TRAKS_SCRIPT_URL }}
      PLEMBFIN_TRAKS_COLLECTOR_ORIGIN: ${{ vars.PLEKT_TRAKS_COLLECTOR_ORIGIN || vars.PLEMBFIN_TRAKS_COLLECTOR_ORIGIN }}
      PLEMBFIN_TRAKS_SITE_KEY: ${{ vars.PLEKT_TRAKS_SITE_KEY || vars.PLEMBFIN_TRAKS_SITE_KEY }}
      PLEMBFIN_TRAKS_REQUIRE_CONSENT: ${{ vars.PLEKT_TRAKS_REQUIRE_CONSENT || vars.PLEMBFIN_TRAKS_REQUIRE_CONSENT || 'true' }}
    steps:
      - name: Checkout selected demo source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || 'main' }}

      - name: Check OCI deployment configuration
        env:
          OCI_DEMO_SSH_KEY: ${{ secrets.OCI_DEMO_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in OCI_DEMO_HOST OCI_DEMO_KNOWN_HOSTS OCI_DEMO_CONTAINER OCI_DEMO_DATA_DIR OCI_DEMO_RUNTIME OCI_DEMO_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions setting: $name" >&2
              exit 1
            fi
          done
          case "$OCI_DEMO_HOST" in
            *[!A-Za-z0-9.-]* ) echo "OCI_DEMO_HOST must be a hostname or IPv4 address" >&2; exit 1 ;;
          esac
          case "$OCI_DEMO_USER" in
            *[!A-Za-z0-9_.-]* ) echo "OCI_DEMO_USER contains unsupported characters" >&2; exit 1 ;;
          esac

      - name: Configure pinned OCI SSH access
        env:
          OCI_DEMO_SSH_KEY: ${{ secrets.OCI_DEMO_SSH_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/plembfin-oci-demo-key"
          known_hosts_path="$RUNNER_TEMP/plembfin-oci-demo-known-hosts"
          printf '%s\n' "$OCI_DEMO_SSH_KEY" > "$key_path"
          printf '%s\n' "$OCI_DEMO_KNOWN_HOSTS" > "$known_hosts_path"
          chmod 600 "$key_path" "$known_hosts_path"
          echo "SSH_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "KNOWN_HOSTS_PATH=$known_hosts_path" >> "$GITHUB_ENV"

      - name: Deploy the exact demo image to OCI
        run: |
          set -euo pipefail
          remote_script="/tmp/plembfin-oracle-demo-${GITHUB_RUN_ID}.sh"
          ssh_opts=(-i "$SSH_KEY_PATH" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_PATH")
          scp "${ssh_opts[@]}" scripts/deploy-oracle-demo.sh "$OCI_DEMO_USER@$OCI_DEMO_HOST:$remote_script"
          trap 'ssh "${ssh_opts[@]}" "$OCI_DEMO_USER@$OCI_DEMO_HOST" "rm -f -- $remote_script" >/dev/null 2>&1 || true' EXIT
          printf -v remote_command 'chmod 700 %q && sudo -n bash %q %q %q %q %q %q %q %q %q %q %q' \
            "$remote_script" "$remote_script" "$RELEASE_IMAGE" "$OCI_DEMO_CONTAINER" \
            "$OCI_DEMO_DATA_DIR" "$OCI_DEMO_PORT" "$OCI_DEMO_RUNTIME" \
            "$PLEMBFIN_TRAKS_SCRIPT_URL" "$PLEMBFIN_TRAKS_SITE_KEY" "$PLEMBFIN_TRAKS_REQUIRE_CONSENT" \
            "$PLEMBFIN_TRAKS_COLLECTOR_ORIGIN"
          ssh "${ssh_opts[@]}" "$OCI_DEMO_USER@$OCI_DEMO_HOST" "$remote_command"

      - name: Verify the demo release version
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if node scripts/verify-oracle-demo.js "$RELEASE_VERSION"; then
              exit 0
            fi
            if (( attempt == 12 )); then
              exit 1
            fi
            sleep 5
          done
