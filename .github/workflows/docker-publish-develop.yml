# Keep legacy image targets for at least six months after the Plekt release.
name: Publish Develop Image

# Publishes a rolling pre-release develop image on every push to develop that changes
# real content, tagged :develop and :develop-<build>. changelog.develop.json's build
# counter and changelog entry are computed locally (scripts/rebuild-develop-changelog.js),
# as part of "Push to git", before the push - this job just reads the value already
# committed, and never writes back to the branch.
#
# Neither "Force to alpha" nor "Force to main" pushes to develop any more, so the
# changelog-only push this filter was written for no longer exists: a promotion's commit
# also carried the public/ asset restamp, so paths-ignore never matched it anyway and
# every promotion published a second, meaningless develop image. Each promotion now
# leaves the reset manifests on the local branch and the next ordinary "Push to git"
# publishes them. See docs/decisions.md entry 18, which supersedes entry 9.
#
# The paths-ignore below is kept as a harmless guard against a future changelog-only
# push; nothing currently produces one.
on:
  push:
    branches: [develop]
    paths-ignore:
      - "changelog.develop.json"
      - "changelog.alpha.json"

concurrency:
  group: docker-publish-develop
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lasikiewicz/plekt
  LEGACY_IMAGE_NAME: lasikiewicz/plembfin

jobs:
  publish:
    name: Verify and publish the develop image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check README consistency
        run: npm run docs:check

      - name: Read develop build number
        id: develop
        run: node -e "const fs=require('fs'); const d=require('./changelog.develop.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build=' + d.build + '\n')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: plekt:develop-check
          build-args: BUILD_CHANNEL=develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Production dependencies install with --ignore-scripts, so a native
      # module with no usable binary for this platform still builds cleanly and
      # would only fail on first database open. Verify native modules load.
      - name: Verify native modules load inside the image
        run: |
          docker run --rm --entrypoint node plekt:develop-check -e "
            const Database = require('better-sqlite3');
            const sharp = require('sharp');
            const db = new Database(':memory:');
            db.exec('CREATE TABLE probe (value TEXT)');
            db.prepare('INSERT INTO probe VALUES (?)').run('ok');
            const row = db.prepare('SELECT value FROM probe').get();
            db.close();
            if (row.value !== 'ok') throw new Error('better-sqlite3 returned unexpected data');
            sharp({ create: { width: 8, height: 8, channels: 3, background: '#000000' } })
              .webp()
              .toBuffer()
              .then((buffer) => {
                if (!buffer.length) throw new Error('sharp produced an empty image');
                console.log('better-sqlite3', require('better-sqlite3/package.json').version, 'and sharp', sharp.versions.sharp, 'both load in the image');
              })
              .catch((error) => { console.error(error); process.exit(1); });
          "

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action lowercases the image ref; github.repository
      # preserves the owner's account casing (Lasikiewicz/plembfin), which
      # GHCR rejects as an image tag. provenance/sbom push a multi-manifest
      # index, and GHCR reads the package description from the index
      # annotations, not image labels.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=raw,value=develop-${{ steps.develop.outputs.build }}

      - name: Build and push develop image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: BUILD_CHANNEL=develop
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
