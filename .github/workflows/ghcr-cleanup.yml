# Rebrand gate: keep dry-run enabled until the new package results are reviewed.
name: GHCR Cleanup

# Every push to develop/alpha publishes a brand-new image tag (develop-<n>,
# alpha-<n>) that nothing ever deletes, and every mutable tag (latest, develop,
# alpha) that gets reassigned leaves its previous manifest dangling as an
# untagged image. This prunes both on a weekly schedule. Release tags
# (semantic versions) and the latest/develop/alpha pointer tags are always
# excluded - only old numbered pre-release tags and truly untagged manifests
# are removed.
#
# A dry-run review confirmed the retention rules only ever match old numbered
# develop-*/alpha-* tags and dangling untagged manifests - latest/develop/alpha
# and semantic-version release tags are never touched.

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Prune old numbered develop tags
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: Lasikiewicz
          package: plekt
          dry-run: true
          delete-tags: 'develop-*'
          exclude-tags: 'develop,alpha,latest'
          keep-n-tagged: 15

      - name: Prune old numbered alpha tags
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: Lasikiewicz
          package: plekt
          dry-run: true
          delete-tags: 'alpha-*'
          exclude-tags: 'develop,alpha,latest'
          keep-n-tagged: 15

      - name: Prune dangling untagged images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: Lasikiewicz
          package: plekt
          dry-run: true
          delete-untagged: true
          older-than: '1 day'
